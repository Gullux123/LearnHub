<nav class="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="logo"><span class="dot"></span>LearnHub</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="resources.html">Resources</a>
      <a href="pricing.html">Pricing</a>
    </div>
    <div class="nav-right">
      <div class="nav-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Search courses...">
      </div>
      <span class="plan-pill" data-plan-pill>Free plan</span>
      <button class="avatar-btn" data-avatar>A</button>
    </div>
  </div>
</nav>

<section class="section-tight">
  <div class="container">
    <div class="section-head">
      <div>
        <h2>Course catalogue</h2>
        <p>20 hands-on courses across Development, Data &amp; AI, and Business. Filter, search, and sort to find your next skill.</p>
      </div>
    </div>

    <div class="filters-bar">
      <input type="text" id="courseSearch" placeholder="Search by title or category…">
      <select id="filterCategory">
        <option value="all">All Categories</option>
        <option value="Development">Development</option>
        <option value="Data & AI">Data &amp; AI</option>
        <option value="Business">Business</option>
      </select>
      <select id="filterLevel">
        <option value="all">All Levels</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>
      <select id="filterPrice">
        <option value="all">Free &amp; Premium</option>
        <option value="free">Free only</option>
        <option value="premium">Premium only</option>
      </select>
      <select id="sortBy">
        <option value="popular">Sort: Most Popular</option>
        <option value="rating">Sort: Highest Rated</option>
        <option value="price-low">Sort: Price — Low to High</option>
        <option value="price-high">Sort: Price — High to Low</option>
        <option value="newest">Sort: Newest</option>
      </select>
    </div>

    <div class="result-count" id="resultCount">Showing <strong>20</strong> of 20 courses</div>
    <div class="course-grid" id="courseGrid"></div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom">
